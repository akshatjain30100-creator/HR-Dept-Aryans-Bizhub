<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAP | Aryan's Bizhub</title>
   <!-- Favicon Photo / Logo in Head -->
  <link rel="icon" type="image/png" href="bizhr.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #password-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .password-card {
      background: #1e293b;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      color: #ffffff;
      max-width: 400px;
      width: 90%;
      border: 1px solid #334155;
    }

    .password-card h2 {
      margin-bottom: 8px;
      font-size: 24px;
    }

    .password-card p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    .input-group input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .input-group input:focus {
      border-color: #2563eb;
    }

    .input-group button {
      padding: 12px 20px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-group button:hover {
      background: #1d4ed8;
    }

    #error-msg {
      color: #ef4444;
      margin-top: 14px;
      font-size: 14px;
      min-height: 20px;
      /* Default desktop/tablet view */
.input-group {
  display: flex;
  gap: 10px; /* Input aur button ke beech thoda gap */
}

/* Mobile View (Screen width 600px ya usse kam) */
@media (max-width: 600px) {
  .input-group {
    flex-direction: column; /* Elements ko upar se neeche (column) align karega */
    align-items: stretch;   /* Dono ki width container ke barabar kar dega */
  }

  .input-group input, 
  .input-group button {
    width: 100%;            /* Dono ki width 100% ho jayegi */
    margin-bottom: 10px;    /* Neeche space banane ke liye */
    }
  </style>
</head>
<body>
<!-- Username Overlay -->
<div id="username-overlay"> 
  <div class="username-card"> 
    <h2>Access Restricted</h2> 
    <p>Is page ko access karne ke liye username enter karein:</p> 
    
    <div class="input-group" style="display: flex; flex-direction: column; gap: 10px;"> 
      <input type="text" id="site-username" placeholder="Enter Username" onkeypress="handleKeyPress(event)" style="width: 100%; padding: 10px;" /> 
      <button onclick="checkUsername()" style="width: 100%; padding: 10px;">Unlock</button> 
    </div> 
    
    <p id="error-msg"></p> 
  </div> 
</div>
<!-- Password Overlay --> 
<div id="password-overlay"> 
  <div class="password-card"> 
    <h2>Access Restricted</h2> 
    <p>Is page ko access karne ke liye password enter karein:</p> 
    
    <div class="input-group" style="display: flex; flex-direction: column; gap: 10px;"> 
      <input type="password" id="site-password" placeholder="Enter Password" onkeypress="handleKeyPress(event)" style="width: 100%; padding: 10px;" /> 
      <button onclick="checkPassword()" style="width: 100%; padding: 10px;">Unlock</button> 
    </div> 
    
    <p id="error-msg"></p> 
  </div> 
</div>

  <script>
    const ALLOWED_USERNAMES = ["Akshat NJ", "Ishita M"]; // Yahan allowed usernames set karein
const TARGET_URL = "https://akshatjain30100-creator.github.io/HR-Dept-Aryans-Bizhub/proxy.html";

function checkUsername() {
  const inputUser = document.getElementById("site-username").value.trim();
  const errorMsg = document.getElementById("error-msg");

  // Case-insensitive match ke liye lowercase me compare kar rahe hain
  const isAllowed = ALLOWED_USERNAMES.some(
    (name) => name.toLowerCase() === inputUser.toLowerCase()
  );

  if (isAllowed && inputUser !== "") {
    // Sahi username dalte hee redirect kar dega
    window.location.href = TARGET_URL;
  } else {
    errorMsg.innerText = "Access Denied! Invalid username.";
  }
}

// Enter key dabane par bhi form submit ho jayega
function handleKeyPress(event) {
  if (event.key === "Enter") {
    checkUsername();
  }
}
    const CORRECT_PASSWORD = "mysecretpassword"; // Yahan apna password set karein
    const TARGET_URL = "https://akshatjain30100-creator.github.io/HR-Dept-Aryans-Bizhub/proxy.html";

    function checkPassword() {
      const inputPass = document.getElementById("site-password").value;
      const errorMsg = document.getElementById("error-msg");

      if (inputPass === CORRECT_PASSWORD) {
        // Sahi password dalte hee redirect kar dega
        window.location.href = TARGET_URL;
      } else {
        errorMsg.innerText = "Incorrect Password! Try again.";
      }
    }

    // Enter key dabane par bhi form submit ho jayega
    function handleKeyPress(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    }
  </script>

</body>
</html>
