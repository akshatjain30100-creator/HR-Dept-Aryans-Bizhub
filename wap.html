<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAP | Aryan's Bizhub</title>
  <link rel="icon" type="image/png" href="bizhr.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .auth-overlay {
      position: fixed;
      inset: 0;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 9999;
    }

    .auth-card {
      background: #1e293b;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      color: #ffffff;
      max-width: 400px;
      width: 100%;
      border: 1px solid #334155;
    }

    .auth-card h2 {
      margin-bottom: 8px;
      font-size: 24px;
    }

    .auth-card p.subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .password-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    .password-wrapper input {
      padding-right: 60px;
    }

    .input-group input:focus {
      border-color: #2563eb;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px;
      width: auto;
    }

    .toggle-password:hover {
      color: #ffffff;
      background: transparent;
    }

    .submit-btn {
      width: 100%;
      padding: 12px 20px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: #1d4ed8;
    }

    .error-msg {
      color: #ef4444;
      margin-top: 14px;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <!-- Username Overlay -->
  <div id="username-overlay" class="auth-overlay">
    <div class="auth-card">
      <h2>Access Restricted</h2>
      <p class="subtitle">Is page ko access karne ke liye username enter karein:</p>

      <div class="input-group">
        <input
          type="text"
          id="site-username"
          placeholder="Enter Username"
          onkeypress="handleKeyPress(event)"
        />
        <button type="button" class="submit-btn" onclick="checkUsername()">Continue</button>
      </div>

      <p id="username-error" class="error-msg"></p>
    </div>
  </div>

  <!-- Password Overlay -->
  <div id="password-overlay" class="auth-overlay" style="display: none;">
    <div class="auth-card">
      <h2>Access Restricted</h2>
      <p class="subtitle">Is page ko access karne ke liye password enter karein:</p>

      <div class="input-group">
        <div class="password-wrapper">
          <input
            type="password"
            id="site-password"
            placeholder="Enter Password"
            onkeypress="handleKeyPress(event)"
          />
          <button
            type="button"
            id="toggle-password-btn"
            class="toggle-password"
            onclick="togglePassword()"
          >
            Show
          </button>
        </div>
        <button type="button" class="submit-btn" onclick="checkPassword()">Unlock</button>
      </div>

      <p id="password-error" class="error-msg"></p>
    </div>
  </div>

  <script>
    const ALLOWED_USERNAMES = ["Akshat NJ", "Ishita M"];
    const CORRECT_PASSWORD = "mysecretpassword";
    const TARGET_URL = "https://akshatjain30100-creator.github.io/HR-Dept-Aryans-Bizhub/proxy.html";

    function checkUsername() {
      const input = document.getElementById("site-username");
      const errorMsg = document.getElementById("username-error");
      const usernameOverlay = document.getElementById("username-overlay");
      const passwordOverlay = document.getElementById("password-overlay");
      const passwordInput = document.getElementById("site-password");

      if (!input || !errorMsg || !usernameOverlay || !passwordOverlay) return;

      const inputUser = input.value.trim();
      const isAllowed = ALLOWED_USERNAMES.some(
        (name) => name.toLowerCase() === inputUser.toLowerCase()
      );

      if (isAllowed && inputUser !== "") {
        errorMsg.innerText = "";
        usernameOverlay.style.display = "none";
        passwordOverlay.style.display = "flex";
        if (passwordInput) passwordInput.focus();
      } else {
        errorMsg.innerText = "Access Denied! Invalid username.";
      }
    }

    function togglePassword() {
      const passwordInput = document.getElementById("site-password");
      const toggleBtn = document.getElementById("toggle-password-btn");
      if (!passwordInput || !toggleBtn) return;

      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        toggleBtn.innerText = "Hide";
      } else {
        passwordInput.type = "password";
        toggleBtn.innerText = "Show";
      }
    }

    function checkPassword() {
      const input = document.getElementById("site-password");
      const errorMsg = document.getElementById("password-error");
      if (!input || !errorMsg) return;

      if (input.value === CORRECT_PASSWORD) {
        errorMsg.innerText = "";
        window.location.href = TARGET_URL;
      } else {
        errorMsg.innerText = "Incorrect Password! Try again.";
      }
    }

    function handleKeyPress(event) {
      if (event.key !== "Enter") return;

      if (event.target && event.target.id === "site-username") {
        checkUsername();
      } else if (event.target && event.target.id === "site-password") {
        checkPassword();
      }
    }
  </script>
</body>
</html>
